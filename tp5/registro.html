<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <!-- Incluir Bootstrap desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Formulario de Registro</h2>

        <!-- Centramos el formulario limitando su ancho en pantallas medianas y grandes -->
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <form>
                    
                    <!-- Mensaje superior estilo alerta -->
                    <div class="alert alert-info text-center" role="alert">
                        Ud. está a punto de registrarse
                    </div>

                    <!-- Nombre Completo -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Escribe tu nombre completo">
                    </div>

                    <!-- Correo Electrónico -->
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <!-- type="email" valida que el formato contenga un @ automáticamente -->
                        <input type="email" class="form-control" id="email" placeholder="ejemplo@dominio.com">
                    </div>

                    <!-- Contraseña -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" placeholder="Crea una contraseña">
                    </div>

                    <!-- Confirmar Contraseña -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Repite tu contraseña">
                    </div>

                    <!-- Género (Radio Buttons) -->
                    <div class="mb-3">
                        <label class="form-label">Género</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="genero" id="masculino" checked>
                            <label class="form-check-label" for="masculino">Masculino</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="genero" id="femenino">
                            <label class="form-check-label" for="femenino">Femenino</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="genero" id="otro">
                            <label class="form-check-label" for="otro">Otro</label>
                        </div>
                    </div>

                    <!-- Términos y Condiciones (Checkbox) -->
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terminos">
                        <!-- El texto subraya los términos, indicando un enlace -->
                        <label class="form-check-label" for="terminos">Acepto los <a href="#">Términos y Condiciones</a></label>
                    </div>

                    <!-- País (Select dropdown) -->
                    <div class="mb-4">
                        <label for="pais" class="form-label">País</label>
                        <select class="form-select" id="pais">
                            <option selected disabled>Selecciona tu país</option>
                            <option value="ar">Argentina</option>
                            <option value="cl">Chile</option>
                            <option value="uy">Uruguay</option>
                        </select>
                    </div>

                    <!-- Botón Registrar -->
                    <!-- La clase w-100 hace que el botón ocupe todo el ancho, btn-primary le da el color azul -->
                    <button type="submit" class="btn btn-primary w-100">Registrar</button>
                    
                </form>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap al final del body -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
